  version: "3.8"
  
  services:
    postgres_test:
      image: postgres:16-alpine
      container_name: postgres-test
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: password
        POSTGRES_DB: walletdb_test
      ports:
        - "5433:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data

  volumes:  
    postgres_data: